name: Security Scanning

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main

# As always, follow the principle of least privilege:     
permissions:
  # Read only access to repository content such as commits, branches, releases and so on.
  contents: read
  # Permissions for GitHub Actions to upload SARIF results:
  security-events: write

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install semgrep
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep

      - name: Run semgrep
        run: |
          semgrep --config=auto --error todo-app/

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - run: echo "Implement trivy scan"

  truffle:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - run: echo "Implement trufflehog scan"
